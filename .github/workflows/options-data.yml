name: Options data

# WHY THIS EXISTS
# Yahoo refuses option requests from Render, so in production the Options window
# answers from closing chains saved after each US close. The snapshot job saves
# 12 symbols into the repo (they feed the demo and AlphaGlyph's archive); this
# job saves ~90 (data/options_symbols.txt) for the backend to read.
#
# It publishes to the `options-data` branch as a single commit that each run
# replaces (force-push), so ~10 MB of daily-changing quotes never pile up in the
# history. The backend reads
# https://raw.githubusercontent.com/<repo>/options-data/options/<SYMBOL>.json
# and index.json (which symbols are covered). If fewer than half the symbols
# answer, nothing is published and yesterday's branch stays; a symbol that fails
# on its own keeps yesterday's file while it still has an expiry ahead.

on:
  schedule:
    - cron: "52 21 * * 1-5"   # 21:52 UTC, after the 16:00 ET close in both EDT and EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Previous files (kept for symbols Yahoo doesn't answer today)
        run: |
          mkdir -p prev
          git fetch --depth=1 origin options-data && \
            git archive origin/options-data options | tar -x -C prev || \
            echo "no previous data"

      - name: Capture
        run: python scripts/capture_options.py --out-dir out --prev prev

      - name: Publish to the options-data branch (one commit, replaced each run)
        run: |
          cd out
          git init -q -b options-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Generated by .github/workflows/options-data.yml on the main branch. Replaced on every run.\n' > README.md
          # Vercel builds every branch it sees; a data branch is not a site.
          printf '{"git": {"deploymentEnabled": false}}\n' > vercel.json
          git add options README.md vercel.json
          git commit -q -m "Options data ($(date -u +%Y-%m-%d))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" options-data
