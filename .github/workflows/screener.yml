name: Screener data

# WHY THIS EXISTS
# The stock screener covers every US-listed common stock (~5,500). Fetching
# that from the free Render backend is impossible (512 MB, and Yahoo refuses
# much of what Render asks for), so it is built here after each US close and
# published as a static file the browser reads directly.
#
# It is published to the `screener-data` branch as a single commit that each
# run replaces (force-push), so a few MB of daily-changing prices never pile up
# in the repository's history. The dashboard fetches
# https://raw.githubusercontent.com/<repo>/screener-data/screener.json.
#
# If the build fails or finds too few stocks, nothing is published and
# yesterday's file stays.

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC: after the 16:00 ET close in both EDT and EST
  workflow_dispatch:
    inputs:
      max_fundamentals:
        description: "Companies whose fundamentals to refresh this run (stalest first)"
        default: "1000"

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Previous fundamentals (kept for stocks Yahoo doesn't answer today)
        run: |
          mkdir -p prev
          git fetch --depth=1 origin screener-data && \
            git show origin/screener-data:fundamentals.json > prev/fundamentals.json || \
            echo "no previous data"

      - name: Build
        run: >
          python scripts/build_screener.py --out-dir out --prev prev/fundamentals.json
          --max-fundamentals "${{ github.event.inputs.max_fundamentals || '1000' }}"

      - name: Publish to the screener-data branch (one commit, replaced each run)
        run: |
          cd out
          git init -q -b screener-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Generated by .github/workflows/screener.yml on the main branch. Replaced on every run.\n' > README.md
          # Vercel builds every branch it sees; a data branch is not a site.
          printf '{"git": {"deploymentEnabled": false}}\n' > vercel.json
          git add screener.json fundamentals.json README.md vercel.json
          git commit -q -m "Screener data ($(date -u +%Y-%m-%d))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screener-data
