<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Tradeski</title>
    <meta name="theme-color" content="#0A0B0D">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="stylesheet" href="tokens.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 440px; }
        .code {
            font-size: 15px;
            font-weight: 600;
            color: #8DB8FF;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-strong);
            margin-bottom: 12px;
        }
        p { font-size: 17px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 32px; }
        .path {
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: bottom;
            color: var(--text-primary);
            font-family: var(--mono);
            font-size: 15px;
        }
        .links { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 44px; padding: 0 22px;
            border-radius: 10px;
            font-size: 15px; font-weight: 600;
            text-decoration: none;
            transition: background-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent-strong); color: #fff; }
        .btn-primary:hover { background: var(--accent); }
        .btn-quiet { color: #8DB8FF; font-weight: 500; padding: 0 8px; }
        .btn-quiet:hover { text-decoration: underline; text-underline-offset: 4px; }
    </style>
</head>
<body>
    <main class="container">
        <p class="code">404</p>
        <h1>This page doesn't exist.</h1>
        <p>Nothing lives at <span class="path" id="path-display">this address</span>.</p>
        <div class="links">
            <a href="/app" class="btn btn-primary">Open the dashboard</a>
            <a href="/" class="btn btn-quiet">Go to the home page <span aria-hidden="true">›</span></a>
        </div>
    </main>
    <script>
        const p = window.location.pathname;
        const el = document.getElementById("path-display");
        if (el) el.textContent = p.length > 40 ? p.slice(0, 40) + "…" : p;
    </script>
</body>
</html>
